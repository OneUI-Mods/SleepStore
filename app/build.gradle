plugins { id 'com.android.application' }
def localSigning = rootProject.file('signing.properties')
def keys = new Properties()
if (localSigning.exists()) localSigning.withInputStream { keys.load(it) }
android {
    namespace 'dev.ryuya.sleepstore'
    compileSdk 36
    defaultConfig { applicationId 'dev.ryuya.sleepstore'; minSdk 35; targetSdk 36; versionCode 1; versionName '0.1.0' }
    signingConfigs {
        release {
            if (localSigning.exists()) {
                storeFile rootProject.file(keys['storeFile'])
                storePassword keys['storePassword']
                keyAlias keys['keyAlias']
                keyPassword keys['keyPassword']
            }
        }
    }
    buildTypes { release { if (localSigning.exists()) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}
dependencies {
    compileOnly files('libs/xposed-api-82.jar')
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
